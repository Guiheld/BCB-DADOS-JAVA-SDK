name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v0.1.0)"
        required: true
        type: string
      title:
        description: "Título do release"
        required: true
        default: BCB-DADOS-JAVA-SDK
        type: string
      description:
        description: "Descrição do release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar (Maven Central + GitHub Packages)
    if: github.actor == 'Guiheld'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Derivar versão da tag
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK, Maven Central e GPG
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Definir versão do projeto
        run: mvn -B -ntp versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Publicar no Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease clean deploy

      - name: Reconfigurar credenciais para GitHub Packages
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          server-id: github

      - name: Publicar no GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -Pgithub deploy

      - name: Criar tag e release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.description }}
        run: gh release create "$TAG" --target master --title "$TITLE" --notes "$BODY"
